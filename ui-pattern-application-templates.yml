schema_version: 1

kind: ui-pattern-application-templates

template_status_values: [active, candidate, superseded]
candidate_selection_policy:
  status: candidate
  selection_status: not_selectable
  required_before_activation:
    - confirmed_sources
    - resolved_boundaries
    - source_provenance
    - application_checks

ux_principle_profiles:
  record_required_fields:
    - principle_id
    - applicability
    - decision
    - implementation_rule
    - affected_ui_refs
    - verification_method
    - status
  status_values: [confirmed, assumption, gap, not_applicable]
  profiles:
    common-ui:
      principle_ids:
        - mental-model-and-familiarity
        - choice-and-cognitive-load
        - information-grouping
        - attention-and-priority
        - completion-experience
    input-and-recovery:
      principle_ids:
        - target-acquisition
        - input-tolerance
        - feedback-and-waiting
        - completion-experience
    complex-workflow:
      principle_ids:
        - choice-and-cognitive-load
        - information-grouping
        - complexity-allocation
        - completion-experience
    responsive-and-mobile:
      principle_ids:
        - target-acquisition
        - input-tolerance
        - information-grouping
        - feedback-and-waiting
    ethical-and-non-happy-path:
      principle_ids:
        - complexity-allocation
        - completion-experience
        - ethical-impact

information_architecture_profiles:
  record_required_fields:
    - ia_principle_id
    - applicability
    - decision
    - rationale
    - affected_ui_refs
    - verification_method
    - status
  applicability_values: [required, recommended, not_applicable, gap]
  status_values: [confirmed, assumption, gap, not_applicable]
  profiles:
    core-information-architecture:
      principle_ids:
        - content-as-objects
        - focused-choice
        - progressive-disclosure
        - content-patterns
        - entry-points
        - multiple-classification
        - purposeful-navigation
        - scalable-growth

templates:
  - template_id: form-workflow-ui
    status: active
    selection_status: selectable
    pattern_id: ui-patterns.forms.form-data-entry-validation
    output_scope: screen-block
    principle_profiles: [common-ui, input-and-recovery]
    required_inputs:
      - screen_id
      - route
      - roles
      - viewport
      - orientation
      - data_fields
      - validation_rules
      - submit_action
      - reference_artifact
    block_structure:
      - block_role: form-container
        required_fields: [purpose, data_source, field_order, layout]
      - block_role: field-group
        required_fields: [field_id, label, type, required, constraints, error_message]
      - block_role: validation-feedback
        required_fields: [field_binding, display_condition, focus_behavior, announcement]
      - block_role: submit-action
        required_fields: [action_id, availability, loading_state, success_transition, error_transition]
      - block_role: operation-feedback
        required_fields: [success_state, error_state, recovery_action]
    required_state_decisions:
      - initial
      - editing
      - disabled
      - validation-error
      - validating
      - submitting
      - success
      - operation-error
    required_actions:
      - edit
      - validate
      - submit
      - cancel-or-reset
    required_transitions:
      - editing-to-validation
      - validation-error-to-editing
      - validation-success-to-submitting
      - submitting-to-success
      - submitting-to-operation-error
    required_checks:
      - field-label-and-value-association
      - required-and-optional-field-rules
      - validation-message-placement
      - focus-after-validation-error
      - submit-loading-and-duplicate-submit-prevention
      - success-and-recovery-behavior
      - narrow-viewport-field-layout

  - template_id: list-detail-ui-data-table
    status: active
    selection_status: selectable
    pattern_id: ui-patterns.lists.data-table
    output_scope: screen-block
    principle_profiles: [common-ui, input-and-recovery]
    required_inputs:
      - screen_id
      - route
      - roles
      - viewport
      - orientation
      - data_source
      - columns
      - row_identity
      - collection_actions
      - reference_artifact
    block_structure:
      - block_role: collection-container
        required_fields: [purpose, data_source, row_identity, ordering]
      - block_role: table-header
        required_fields: [columns, sort_rules, label_strategy]
      - block_role: filter-and-search
        required_fields: [fields, trigger, reset_action, empty_result]
      - block_role: table-body
        required_fields: [row_fields, loading_state, empty_state, error_state]
      - block_role: row-actions
        required_fields: [action_id, availability, confirmation, success_transition, error_transition]
      - block_role: pagination
        required_fields: [page_size, navigation_actions, loading_behavior, boundary_behavior]
    required_state_decisions:
      - loading
      - populated
      - empty
      - filtered-empty
      - sorted
      - error
      - disabled-action
    required_actions:
      - search
      - filter
      - reset-filter
      - sort
      - change-page
      - row-action
    required_transitions:
      - unfiltered-to-filtered
      - collection-to-sorted
      - page-to-page
      - row-to-detail-or-action
      - error-to-retry
    required_checks:
      - column-meaning-and-order
      - row-identity
      - loading-empty-error-states
      - filter-and-reset-behavior
      - sort-and-pagination-behavior
      - row-action-confirmation-and-recovery
      - narrow-viewport-overflow

  - template_id: list-detail-ui-card-feed
    status: active
    selection_status: selectable
    pattern_id: ui-patterns.lists.card-feed
    output_scope: screen-block
    principle_profiles: [common-ui, input-and-recovery]
    required_inputs:
      - screen_id
      - route
      - roles
      - viewport
      - orientation
      - data_source
      - item_identity
      - card_content_slots
      - collection_actions
      - content_density
      - reference_artifact
    block_structure:
      - block_role: collection-container
        required_fields: [purpose, data_source, item_identity, ordering]
      - block_role: collection-controls
        required_fields: [search_applicability, filter_applicability, reset_behavior, empty_result]
      - block_role: card-grid
        required_fields: [layout_rule, card_order, reflow_conditions, spacing_rule]
      - block_role: collection-card
        required_fields: [item_identity, title, content_slots, optional_media, open_behavior]
      - block_role: card-actions
        required_fields: [action_id, applicability, availability, confirmation, success_transition, error_transition]
      - block_role: collection-status
        required_fields: [loading_state, empty_state, filtered_empty_state, error_state, recovery_action]
    required_state_decisions:
      - loading
      - populated
      - empty
      - filtered-empty
      - error
      - disabled-action
    required_actions:
      - open-item
      - search-if-defined
      - filter-if-defined
      - reset-filter-if-defined
      - card-action-if-defined
    required_transitions:
      - loading-to-populated-or-error
      - collection-to-filtered-or-filtered-empty
      - filtered-to-reset
      - card-to-detail-or-action
      - error-to-retry
    required_checks:
      - card-identity-and-content-hierarchy
      - card-grid-reflow-at-confirmed-viewports
      - collection-order-and-item-open-behavior
      - loading-empty-filtered-empty-and-error-states
      - action-availability-and-recovery
      - keyboard-focus-and-status-announcement
      - narrow-viewport-card-overflow

  - template_id: navigation-content-ui-menu
    status: active
    selection_status: selectable
    pattern_id: ui-patterns.navigation.menu-navigation
    output_scope: screen-region
    principle_profiles: [common-ui]
    required_inputs:
      - screen_id
      - route_map
      - roles
      - selected_route
      - viewport
      - orientation
      - reference_artifact
    block_structure:
      - block_role: navigation-region
        required_fields: [purpose, accessible_name, placement, hierarchy]
      - block_role: menu-item
        required_fields: [item_id, label, route, role_visibility, selected_condition]
      - block_role: submenu
        required_fields: [parent_item, open_condition, close_condition, child_order]
      - block_role: collapsed-navigation
        required_fields: [trigger, expanded_state, focus_behavior, viewport_condition]
    required_state_decisions:
      - selected
      - opened-submenu
      - closed-submenu
      - collapsed
      - expanded
      - disabled
      - unavailable-route
    required_actions:
      - open-item
      - close-item
      - navigate
      - expand-or-collapse
    required_transitions:
      - menu-item-to-route
      - closed-submenu-to-open-submenu
      - expanded-to-collapsed
      - unavailable-route-to-error
    required_checks:
      - route-and-label-ownership
      - selected-and-open-state
      - keyboard-navigation
      - screen-reader-structure
      - focus-after-route-change
      - collapsed-navigation-at-supported-viewport
      - deep-link-and-back-navigation

  - template_id: dialog-overlay-ui-modal
    status: active
    selection_status: selectable
    pattern_id: ui-patterns.dialogs.modal-dialog
    output_scope: overlay-block
    principle_profiles: [common-ui, input-and-recovery]
    required_inputs:
      - screen_id
      - trigger
      - purpose
      - roles
      - content
      - primary_action
      - secondary_action
      - viewport
      - reference_artifact
    block_structure:
      - block_role: dialog-trigger
        required_fields: [trigger_id, availability, open_transition]
      - block_role: dialog-overlay
        required_fields: [modal_behavior, background_interaction, close_policy]
      - block_role: dialog-content
        required_fields: [title, description, fields, content_size]
      - block_role: dialog-actions
        required_fields: [primary_action, secondary_action, cancel_action, availability]
      - block_role: dialog-feedback
        required_fields: [loading_state, success_state, error_state, recovery_action]
    required_state_decisions:
      - closed
      - open
      - submitting
      - success
      - error
      - asynchronous-close
    required_actions:
      - open
      - confirm
      - cancel
      - close
      - retry-or-recover
    required_transitions:
      - closed-to-open
      - open-to-confirm
      - open-to-cancel
      - open-to-error
      - error-to-retry-or-recover
      - success-to-closed
    required_checks:
      - dialog-purpose-and-content-size
      - title-and-description-association
      - focus-entry-and-focus-return
      - escape-and-dismiss-policy
      - primary-secondary-cancel-actions
      - loading-success-error-feedback
      - background-interaction-policy
      - narrow-viewport-dialog-behavior

  - template_id: dashboard-monitoring-ui
    status: active
    selection_status: selectable
    pattern_id: ui-patterns.dashboards.dashboard-monitoring
    output_scope: screen-block
    principle_profiles: [common-ui, input-and-recovery]
    required_inputs: [screen_id, route, roles, viewport, orientation, data_source, metric_definitions, dashboard_mode, time_range, filters, reference_artifact]
    required_blocks:
      - dashboard-container: [purpose, dashboard_mode, data_source, refresh_behavior]
      - metric-summary: [metric_id, label, value, unit, priority, comparison]
      - visualization-grid: [visualization_id, data_binding, chart_purpose, hierarchy, legend]
      - filter-controls: [filter_id, field, value_set, trigger, reset_action]
      - drill-down: [source_visualization, target_detail, condition, data_preservation]
      - annotation: [target, meaning, visibility_condition]
    required_states: [initial, loading, populated, empty, filtered, error, stale]
    required_actions: [filter, search, sort, roll-up, drill-down, reset-filter, retry]
    required_transitions: [dashboard-to-filtered-view, dashboard-to-sorted-view, dashboard-to-rolled-up-view, dashboard-to-drilled-down-view, error-to-retry, chart-to-linked-chart-update]
    required_checks: [dashboard-purpose-and-mode, metric-priority-and-limit, visual-hierarchy, consistent-color-assignment, whitespace-and-layout, linked-chart-update, annotation-meaning, loading-empty-error-states, accessibility-alternative, narrow-viewport-behavior]

  - template_id: mobile-touch-ui
    status: active
    selection_status: selectable
    pattern_id: ui-patterns.mobile.mobile-touch-interface
    output_scope: screen-and-interaction
    principle_profiles: [common-ui, input-and-recovery, responsive-and-mobile]
    required_inputs:
      - screen_id
      - route
      - roles
      - platform
      - viewport
      - orientation
      - safe_area
      - data_source
      - primary_actions
      - gesture_map
      - navigation_model
      - keyboard_fallback
      - accessibility_profile
      - reference_artifact
    required_blocks:
      - mobile-shell: [purpose, platform, viewport, orientation, safe_area, keyboard_behavior]
      - primary-navigation: [navigation_model, back_action, reachability, focus_order]
      - content-or-task: [purpose, data_source, content_priority, scroll_behavior]
      - touch-actions: [action_id, gesture, target_size, target_unit, feedback, alternative_action, availability]
      - state-feedback: [state_id, entry_condition, visible_change, available_actions, recovery_action]
      - accessibility-fallback: [accessible_name, role, alternative_input, focus_or_scan_order]
    required_states: [initial, loading, content, empty, error, offline, disabled, pressed, gesture-feedback, keyboard-visible]
    required_actions: [tap, swipe, drag, touch-and-hold, zoom, navigate-back, retry, dismiss, keyboard-or-assistive-action]
    required_transitions: [initial-to-loading, loading-to-content, loading-to-error, content-to-empty, content-to-next-screen, error-to-retry, gesture-to-feedback, keyboard-visible-to-restored-layout]
    required_checks:
      - platform-and-device-scope
      - viewport-orientation-and-safe-area
      - platform-specific-touch-target-size-and-spacing
      - reachable-primary-navigation
      - visible-alternative-to-essential-gestures
      - gesture-feedback-and-conflict-check
      - keyboard-and-assistive-input-fallback
      - accessible-name-role-and-focus-order
      - loading-empty-error-offline-recovery
      - portrait-landscape-reflow-and-overflow
      - text-scaling-and-contrast

  - template_id: multi-step-workflow-ui
    scope: cross-cutting
    pattern_id: null
    output_scope: screen-and-workflow
    principle_profiles: [complex-workflow]
    applies_when:
      - task_has_ordered_steps
      - each_step_has_a_distinct_goal
      - user_must_review_or_confirm_progress
    required_inputs:
      - workflow_id
      - step_sequence
      - step_goals
      - step_validation
      - data_preservation
      - back_navigation_policy
      - resume_policy
      - completion_action
    required_blocks:
      - step-indicator: [current_step, completed_steps, available_steps, label_strategy]
      - current-step: [step_id, purpose, fields_or_actions, validation]
      - workflow-navigation: [next_action, back_action, cancel_action, availability]
      - review-and-completion: [summary, correction_path, submit_action, result_feedback]
    required_states: [initial, editing, invalid-step, saved, submitting, success, error, resumed]
    required_actions: [next, back, save, cancel, review, submit, resume, retry]
    required_transitions: [step-to-next, step-to-back, step-to-invalid, workflow-to-review, review-to-submit, submit-to-success, submit-to-error, error-to-retry]
    required_checks:
      - one_primary_decision_group_per_step
      - progress_and_current_step_are_visible
      - entered_data_is_preserved_after_navigation
      - step_validation_does_not_hide_recovery
      - final_review_exposes_corrections
      - interrupted_workflow_can_resume_or_is_explicitly_discarded

  - template_id: stateful-action-ui
    scope: cross-cutting
    pattern_id: null
    output_scope: action-and-state
    principle_profiles: [input-and-recovery, complex-workflow, ethical-and-non-happy-path]
    applies_when:
      - operation_can_outlive_immediate_response
      - operation_requires_progress_or_status
      - operation_can_be_cancelled_retried_or_resumed
    required_inputs:
      - action_id
      - operation_duration_class
      - progress_model
      - cancellation_policy
      - retry_policy
      - idempotency_policy
      - result_persistence
      - failure_recovery
    required_blocks:
      - action-feedback: [action_id, phase, visible_status, feedback_channel]
      - progress-indicator: [progress_type, value_or_message, completion_condition]
      - cancellation-control: [availability, confirmation, rollback_or_partial_result]
      - recovery-feedback: [error_description, retry_action, support_path, preserved_data]
    required_states: [idle, queued, running, paused, cancelling, success, error, cancelled, retrying]
    required_actions: [start, cancel, pause, resume, retry, dismiss, inspect-result]
    required_transitions: [idle-to-queued, queued-to-running, running-to-success, running-to-error, running-to-cancelling, cancelling-to-cancelled, error-to-retrying, paused-to-resumed]
    required_checks:
      - immediate_feedback_for_action_start
      - long_operation_has_visible_progress_or_explanation
      - duplicate_submission_is_prevented
      - cancellation_result_is_explicit
      - retry_does_not_duplicate_or_corrupt_data
      - success_and_error_are_distinguishable
      - interrupted_operation_has_recovery_or_gap

  - template_id: progressive-onboarding-ui
    scope: cross-cutting
    pattern_id: null
    output_scope: screen-and-guidance
    principle_profiles: [common-ui, complex-workflow, ethical-and-non-happy-path]
    applies_when:
      - user_is_new_to_the_context
      - task_requires_new_concepts_or_steps
      - guidance_can_be_delivered_during_use
    required_inputs:
      - user_goal
      - existing_knowledge_assumption
      - guidance_scope
      - disclosure_sequence
      - skip_policy
      - resume_policy
      - contextual_help
      - completion_signal
    required_blocks:
      - entry-guidance: [purpose, user_goal, start_action, skip_action]
      - guided-step: [step_id, instruction, related_ui_ref, completion_condition]
      - contextual-help: [trigger, content, placement, dismissal]
      - onboarding-completion: [completion_signal, next_action, reopen_path]
    required_states: [not-started, active, skipped, paused, completed, resumed]
    required_actions: [start, continue, back, skip, pause, resume, reopen, dismiss]
    required_transitions: [not-started-to-active, active-to-next-step, active-to-skipped, active-to-paused, paused-to-resumed, active-to-completed]
    required_checks:
      - guidance_does_not_block_the_primary_task_without_justification
      - each_step_has_one_clear_goal
      - guidance_is_available_in_context_of_use
      - skip_and_resume_behavior_is_explicit
      - onboarding_does_not_require_memorizing_hidden_rules
      - completion_and_reopen_paths_are_accessible

  - template_id: responsive-ui
    scope: cross-cutting
    pattern_id: null
    output_scope: viewport-and-layout
    principle_profiles: [responsive-and-mobile, common-ui]
    applies_when:
      - more_than_one_viewport_or_orientation_is_supported
      - layout_or_priority_changes_between_viewports
    required_inputs:
      - supported_viewports
      - supported_orientations
      - breakpoint_or_change_conditions
      - block_priority
      - overflow_policy
      - focus_order_policy
      - text_scaling_policy
    required_blocks:
      - layout-variant: [viewport_condition, composition, order, visibility]
      - priority-preservation: [essential_content, essential_actions, deferred_content]
      - overflow-and-scroll: [axis, ownership, boundary_behavior, recovery]
    required_states: [wide, compact, narrow, portrait, landscape, overflow]
    required_actions: [resize, rotate, expand, collapse, scroll, restore-layout]
    required_transitions: [wide-to-compact, compact-to-narrow, portrait-to-landscape, layout-to-overflow, overflow-to-restored]
    required_checks:
      - essential_content_and_actions_remain_available
      - block_order_and_grouping_remain_meaningful
      - focus_order_matches_visual_or_logical_order
      - overflow_owner_and_scroll_boundary_are_explicit
      - text_scaling_does_not_destroy_completion_of_the_task
      - orientation_change_preserves_or_recovers_user_data

  - template_id: information-architecture-ui
    scope: cross-cutting
    pattern_id: null
    output_scope: content-and-navigation
    information_architecture_profiles: [core-information-architecture]
    applies_when:
      - screen_contains_multiple_content_types_or_routes
      - user_can_find_content_by_browse_search_or_contextual_links
      - content_labels_or_relationships_affect_task_completion
      - content_structure_must_grow_beyond_current_scope
    required_inputs:
      - content_inventory
      - content_types_and_relationships
      - content_lifecycle
      - findability_modes
      - labels_and_user_vocabulary
      - entry_points
      - navigation_scope
      - content_growth_expectation
      - information_architecture_validation
      - reference_artifact
    required_blocks:
      - content-model: [content_types, attributes, lifecycle, relationships]
      - organization-model: [model, scope, grouping, hierarchy, access_paths]
      - labeling-system: [label_id, label, user_term, meaning, ambiguity_resolution]
      - navigation-model: [global, local, contextual, entry_points, back_behavior]
      - findability: [search, browse, filters, zero_results, related_content]
      - structure-artifact: [artifact_type, path_or_url, status, affected_ui_refs]
    required_states: [initial, loading, empty, zero-results, restricted, deep-link, not-found]
    required_actions: [browse, search, filter, open-entry-point, navigate-back, retry-or-recover]
    required_transitions: [entry-to-content, content-to-related-content, search-to-results, search-to-zero-results, deep-link-to-content, not-found-to-recovery]
    required_checks:
      - content_inventory_covers_all_user_visible_types
      - content_relationships_and_lifecycle_are_explicit
      - organization_model_matches_scope_and_user_findability_modes
      - labels_use_user_vocabulary_or_have_justified_deviations
      - each_entry_point_identifies_context_and_next_available_actions
      - global_local_and_contextual_navigation_are_distinguished
      - search_browse_and_filter_paths_are_not_mutually_exclusive_without_reason
      - zero_results_not_found_and_restricted_content_have_recovery
      - deep_links_preserve_identity_context_and_back_navigation
      - structure_can_grow_without_uncontrolled_navigation_complexity
      - information_architecture_is_validated_by_declared_method

  - template_id: landing-page-composition-ui
    status: active
    selection_status: selectable
    scope: cross-cutting
    pattern_id: null
    output_scope: multi-section-screen-content
    principle_profiles: [common-ui]
    applies_when:
      - organization_model_is_single_page
      - one_primary_page_goal_is_confirmed
      - one_primary_action_is_confirmed
      - page_combines_multiple_meaningful_blocks
    do_not_apply_when:
      - page_goal_or_primary_action_is_unknown
      - screen_is_a_single_task_block_without_page_composition
      - multiple_independent_primary_goals_are_required
    unknown_behavior: record-as-gap
    required_inputs:
      - page_goal
      - confirmed_offer
      - target_audience
      - route_or_entry_point
      - entry_promise_or_not_applicable
      - primary_action_id_and_result
      - approved_content_and_evidence_register
      - confirmed_viewport_matrix_or_draft_status
      - design_system_or_gap
      - section_pattern_candidates
    output_contract:
      - ordered_sections_with_purpose_and_content_source
      - first_screen_message_and_action_priority
      - primary_action_repetition_policy
      - secondary_action_rationale
      - conditional_media_form_proof_and_faq
      - section_states_and_pattern_refs
      - responsive_reflow_and_focus_order
      - claim_to_source_traceability
    block_record_fields: [block_id, purpose, order, content_refs, evidence_refs, state_refs, pattern_refs, viewport_behavior]
    required_blocks:
      - entry: [offer, audience, next_step, primary_action_id, content_refs]
      - supporting_content: [purpose, order, content_refs, pattern_refs]
      - primary_action: [action_id, result, label, state_refs, repeated_at]
    conditional_blocks:
      - proof: [verified_evidence_refs, claim_refs, include_only_if_available]
      - objections: [confirmed_objection_refs, answer_refs, include_only_if_available]
      - form: [required_field_refs, validation, success, error, recovery, include_only_if_action_requires]
      - media: [source, purpose, text_alternative, performance_budget, include_only_if_supported]
      - navigation: [route_refs, purpose, include_only_if_required]
    related_templates:
      conditional: [information-architecture-ui, responsive-ui]
      scenario_only: [stateful-action-ui, progressive-onboarding-ui]
    required_checks:
      - selection_conditions_and_rejections_recorded
      - one_primary_action_id_across_repeated_ctas
      - first_screen_offer_audience_and_next_step_are_confirmed
      - every_claim_and_heading_has_content_source
      - media_does_not_obscure_message_or_action
      - optional_blocks_have_confirmed_inputs
