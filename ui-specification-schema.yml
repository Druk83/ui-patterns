schema_version: 1

kind: ui-specification-package
ownership: project-repository
purpose: Машиночитаемый контракт конкретного UI-пакета, а не универсальный каталог паттернов

package:
  required:
    - spec_id
    - version
    - template_set_version
    - status
    - source_refs
    - screen_pool
    - screen_manifest
    - pattern_refs
    - principle_decisions
    - ia_decisions
    - acceptance_refs
  status_values:
    - draft
    - review
    - approved
    - superseded

screen_pool:
  required:
    - pool_id
    - version
    - status
    - confirmation_ref
  status_values:
    - confirmed
    - superseded

screen_manifest:
  required:
    - screen_id
    - screen_pool_ref
    - title
    - route
    - purpose
    - interface_type
    - usage_context
    - interface_modality
    - data_scale_and_performance
    - integration_and_component_constraints
    - roles
    - viewport
    - orientation
    - responsive_profile
    - states
    - blocks
    - reference_artifacts
    - applied_templates
    - template_id
    - template_revision
    - principle_profiles
    - principle_decisions
    - information_architecture_profiles
    - ia_decisions
    - risk_and_ethics
    - status
    - acceptance_refs

usage_context:
  required:
    - environment
    - device_and_viewport
    - usage_frequency
    - task_criticality
    - user_preparation

interface_modality:
  required:
    - input_channels
    - output_channels
    - primary_modality
    - fallback_modality

data_scale_and_performance:
  required:
    - data_volume_class
    - loading_strategy
    - update_frequency
    - response_expectation
    - long_operation_behavior

integration_and_component_constraints:
  required:
    - data_integrations
    - external_services
    - component_system
    - design_tokens
    - compatibility_constraints

block:
  required:
    - ui_id
    - purpose
    - data
    - controls
    - actions
    - states
    - transitions
    - validation
    - accessibility
    - responsive
    - traceability

action:
  required:
    - action_id
    - label
    - trigger
    - availability
    - input
    - success
    - error
    - transitions
    - acceptance_refs

state:
  required:
    - state_id
    - entry_conditions
    - visible_changes
    - available_actions
    - exit_transitions

transition:
  required:
    - source
    - event
    - condition
    - target
    - data_preservation

reference_artifact:
  required:
    - artifact_id
    - type
    - path_or_url
    - status
    - viewport
    - orientation
    - role
    - state
    - version

traceability:
  required:
    - requirement_refs
    - scenario_refs
    - pattern_refs
    - acceptance_refs

principle_decision:
  required:
    - principle_id
    - applicability
    - decision
    - implementation_rule
    - affected_ui_refs
    - verification_method
    - status
  applicability_values:
    - required
    - recommended
    - not_applicable
    - gap
  status_values:
    - confirmed
    - assumption
    - gap
    - not_applicable

ia_decision:
  required:
    - ia_decision_id
    - ia_principle_id
    - applicability
    - scope
    - decision
    - rationale
    - affected_ui_refs
    - verification_method
    - status
  applicability_values:
    - required
    - recommended
    - not_applicable
    - gap
  status_values:
    - confirmed
    - assumption
    - gap
    - not_applicable

risk_and_ethics:
  required:
    - behavioral_influence
    - user_benefit
    - foreseeable_harm
    - safeguards
    - non_happy_path_coverage
  behavioral_influence_values:
    - none
    - possible
    - intended

gap:
  required:
    - gap_id
    - missing_decision
    - owner
    - blocking_condition
    - closure_evidence
