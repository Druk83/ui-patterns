schema_version: 1
catalog_id: ui-patterns
catalog_version: 0.3.2
domain: ui
visibility: public

purpose: >-
  Сжатый машинно-читаемый каталог для выбора UI-паттерна и формирования
  конкретной UI-спецификации. Каталог не содержит факты отдельного продукта.

start_here:
  procedure: ui-pattern-selection.md
  output_schema: ui-specification-schema.yml
  screen_template: ui-screen-specification-template.md
  application_templates: ui-pattern-application-templates.yml
  screen_pool_schema: шаблоны-экранов/контракт-пула-экранов.yml
  screen_ui_templates: шаблоны-экранов/manifest.json
  screen_shell_contract: screen-shell-integration-contract.md

selection_order:
  - ui_scope
  - screen_context
  - user_task
  - user_context
  - usage_environment
  - screen_criticality
  - interface_modality
  - information_architecture_context
  - data_shape
  - data_density
  - data_volume_and_performance
  - choice_complexity
  - interaction_model
  - input_method_and_device_context
  - state_model
  - response_time_expectation
  - error_cost_and_recovery
  - familiar_pattern_constraints
  - viewport_constraints
  - screen_shell_resolution
  - accessibility_constraints
  - pattern_conditions
  - pattern_contraindications
  - compatibility

required_context:
  - screen_id
  - screen_purpose
  - user_roles
  - user_context
  - usage_environment
  - screen_criticality
  - interface_modality
  - information_architecture_context
  - route_or_entry_point
  - data_source_and_shape
  - data_density
  - task_frequency_and_urgency
  - user_actions
  - choice_complexity
  - input_method_and_device_context
  - states_and_transitions
  - response_time_expectation
  - error_cost_and_recovery
  - familiar_pattern_constraints
  - data_volume_and_performance
  - integration_and_component_constraints
  - viewport_and_orientation
  - accessibility_constraints
  - requirement_and_scenario_refs

context_status_values: [confirmed, requirement, assumption, gap]
principle_applicability_values: [required, recommended, not_applicable, gap]

information_architecture_context:
  required:
    - content_scope_and_types
    - content_relationships_and_lifecycle
    - findability_modes
    - labels_and_user_vocabulary
    - entry_points_and_navigation_scope
    - content_growth_expectation
  findability_modes:
    - known_item
    - exploration
    - unknown_need
    - repeat_search
  organization_models:
    - single_page
    - flat
    - index
    - central_hub
    - strict_hierarchy
    - multi_dimensional_hierarchy
  missing_behavior: record-as-gap

usage_context:
  required:
    - environment
    - device_and_viewport
    - usage_frequency
    - task_criticality
    - user_preparation
  environment_values:
    - office
    - field
    - warehouse
    - production
    - remote_terminal
    - multi_monitor
    - unknown
  missing_behavior: record-as-gap

interface_modality:
  required:
    - input_channels
    - output_channels
    - primary_modality
    - fallback_modality
  channel_values:
    - pointer
    - keyboard
    - touch
    - gesture
    - voice
    - text_command
    - conversational
    - visual
    - audio
  missing_behavior: record-as-gap

data_volume_and_performance:
  required:
    - data_volume_class
    - loading_strategy
    - update_frequency
    - response_expectation
    - long_operation_behavior
  volume_values: [small, medium, large, unknown]
  strategy_values: [eager, lazy, paginated, virtualized, server_side, unknown]
  missing_behavior: record-as-gap

integration_and_component_constraints:
  required:
    - data_integrations
    - external_services
    - component_system
    - design_tokens
    - compatibility_constraints
  missing_behavior: record-as-gap

family_paths:
  forms: формы
  lists: списки
  dashboards: панели-мониторинга
  mobile: мобильные
  navigation: навигация
  dialogs: диалоги

cross_cutting_templates:
  - multi-step-workflow-ui
  - stateful-action-ui
  - progressive-onboarding-ui
  - responsive-ui
  - information-architecture-ui
  - landing-page-composition-ui

landing_page_composition:
  template_id: landing-page-composition-ui
  selection_status: selectable
  required_conditions:
    - confirmed_single_page_organization
    - confirmed_primary_goal_and_action
    - multiple_meaningful_sections
  missing_context_behavior: record-as-gap
  screen_template_id: landing-page-screen
  screen_content_scope: composition-only
  block_pattern_policy: select-active-patterns-per-block

candidate_cross_cutting_templates:
  selection_status: not_selectable
  entries:
    - template_id: role-based-ui
      title: Ролевой интерфейс
      status: candidate
    - template_id: enterprise-ui-context
      title: Enterprise-контекст интерфейса
      status: candidate

extended_templates:
  selection_status: selectable
  note: Активные расширенные шаблоны выбираются только при выполнении их required_conditions и заполнении обязательных входов.
  entries:
    - pattern_id: ui-patterns.command-line.command-interface
      title: Командный интерфейс
      family_path: командная-строка/командный-интерфейс.md
      pattern_type: CLI_COMMAND_UI
      template_id: cli-command-ui
      diagram_source: командная-строка/командный-интерфейс.plantuml
      diagram_artifact: командная-строка/командный-интерфейс.png
      status: active
    - pattern_id: ui-patterns.conversational.conversational-interface
      title: Разговорный интерфейс
      family_path: разговорные-интерфейсы/разговорный-интерфейс.md
      pattern_type: CUI_CONVERSATIONAL_UI
      template_id: conversational-ui
      diagram_source: разговорные-интерфейсы/разговорный-интерфейс.plantuml
      diagram_artifact: разговорные-интерфейсы/разговорный-интерфейс.png
      status: active
    - pattern_id: ui-patterns.voice.voice-interface
      title: Голосовой интерфейс
      family_path: голосовые-интерфейсы/голосовой-интерфейс.md
      pattern_type: VUI_VOICE_UI
      template_id: voice-ui
      diagram_source: голосовые-интерфейсы/голосовой-интерфейс.plantuml
      diagram_artifact: голосовые-интерфейсы/голосовой-интерфейс.png
      status: active
    - pattern_id: ui-patterns.text.text-interface
      title: Текстовый интерфейс с псевдографикой
      family_path: текстовые-интерфейсы/текстовый-интерфейс.md
      pattern_type: TUI_TEXT_UI
      template_id: text-terminal-ui
      diagram_source: текстовые-интерфейсы/текстовый-интерфейс.plantuml
      diagram_artifact: текстовые-интерфейсы/текстовый-интерфейс.png
      status: active
    - pattern_id: ui-patterns.natural-interaction.natural-interface
      title: Естественное взаимодействие
      family_path: естественное-взаимодействие/естественный-интерфейс.md
      pattern_type: NUI_NATURAL_INTERACTION_UI
      template_id: natural-interaction-ui
      diagram_source: естественное-взаимодействие/естественный-интерфейс.plantuml
      diagram_artifact: естественное-взаимодействие/естественный-интерфейс.png
      status: active
    - pattern_id: ui-patterns.processes.workflow-process-interface
      title: Интерфейс визуализации процесса
      family_path: процессы/интерфейс-визуализации-процесса.md
      pattern_type: WORKFLOW_PROCESS_UI
      template_id: workflow-process-ui
      diagram_source: процессы/интерфейс-визуализации-процесса.plantuml
      diagram_artifact: процессы/интерфейс-визуализации-процесса.png
      status: active

decision_result:
  required:
    - selected_pattern
    - catalog_version
    - input_facts
    - rejected_candidates
    - applied_templates
    - principle_decisions
    - ia_decisions
    - generated_ui_blocks
    - unresolved_gaps
  rejection_record:
    required: [candidate, decision, reason, related_context]

quality_policy:
  include_only:
    - verified-general-rules
    - normalized-selection-criteria
    - required-output-fields
    - explicit-known-limitations
  exclude:
    - project-specific-facts
    - unverified-recommendations
    - illustrative-domain-entities
    - private-source-locations
    - unsupported-accessibility-or-responsive-claims
  evidence_statuses: [confirmed, partial, gap]
  unknown_behavior: record-as-gap
  no_exact_match_behavior: stop-selection-and-record-gap

entries:
  - id: ui-patterns.forms.form-data-entry-validation
    title: Ввод и валидация данных формы
    family: forms
    pattern_type: FORM_WORKFLOW_UI
    decision_scope: screen-block
    status: active
    card_path: формы/ввод-и-валидация-данных.md
    template_id: form-workflow-ui
    diagram_source: формы/ввод-и-валидация-данных.plantuml
    diagram_artifact: формы/ввод-и-валидация-данных.png
    intent: Собрать, проверить и отправить введённые пользователем данные.
    required_conditions:
      - пользователь вводит или изменяет структурированные данные
      - существует проверка или отправка данных
    selection_signals:
      - несколько полей ввода
      - обязательные и необязательные поля
      - field-level validation
      - explicit submit
    contraindications:
      - отсутствует ввод данных
      - требуется только подтверждение уже сформированного действия
      - содержание требует длительного чтения или сложной навигации
    compatible_with: [ui-patterns.dialogs.modal-dialog]
    limitations:
      - project-specific accessibility and breakpoint rules are required

  - id: ui-patterns.lists.data-table
    title: Табличное отображение структурированных данных
    family: lists
    pattern_type: LIST_DETAIL_UI
    decision_scope: screen-block
    status: active
    card_path: списки/табличное-отображение-данных.md
    template_id: list-detail-ui-data-table
    diagram_source: списки/табличное-отображение-данных.plantuml
    diagram_artifact: списки/табличное-отображение-данных.png
    intent: Показать коллекцию однотипных данных с операциями поиска, фильтрации, сортировки или постраничного просмотра.
    required_conditions:
      - данные имеют повторяющуюся строковую структуру
      - пользователю требуется просматривать элементы коллекции
    selection_signals:
      - однородные строки и колонки
      - поиск или фильтрация
      - сортировка
      - pagination
      - действия над строкой
    contraindications:
      - данные требуют свободного визуального сравнения без строковой структуры
      - узкий viewport не допускает таблицу без подтверждённого overflow-решения
    compatible_with: [ui-patterns.navigation.menu-navigation, ui-patterns.dialogs.modal-dialog]
    limitations:
      - narrow-viewport and accessibility behavior require project decisions

  - id: ui-patterns.lists.card-feed
    title: Карточная лента коллекции
    family: lists
    pattern_type: LIST_DETAIL_UI
    decision_scope: screen-block
    status: active
    card_path: списки/карточная-лента.md
    template_id: list-detail-ui-card-feed
    diagram_source: списки/карточная-лента.plantuml
    diagram_artifact: списки/карточная-лента.png
    intent: Представить коллекцию самостоятельными карточками в адаптивной сетке для быстрого просмотра содержимого.
    required_conditions:
      - пользователю нужно просматривать коллекцию самостоятельных элементов
      - содержимое элемента воспринимается как единая карточка, а не как строка общих колонок
    selection_signals:
      - карточки содержат несколько связанных атрибутов одного элемента
      - содержимое карточек может различаться по объёму или визуальной структуре
      - элементы удобнее сканировать по отдельности, а не сравнивать по общей колонке
    contraindications:
      - пользователю важно сопоставлять значения одних и тех же полей в строках и колонках
      - требуется высокая плотность структурированных строковых данных
      - порядок, поля и операции над коллекцией не подтверждены требованиями
    compatible_with: [ui-patterns.navigation.menu-navigation, ui-patterns.dialogs.modal-dialog]
    limitations:
      - состав карточки и действия над элементом определяются требованиями проекта
      - число колонок и responsive-условия определяются подтверждённой матрицей viewport
      - доступность, фильтрация и поведение пустых состояний требуют проектных решений

  - id: ui-patterns.navigation.menu-navigation
    title: Иерархическая навигация меню
    family: navigation
    pattern_type: NAVIGATION_CONTENT_UI
    decision_scope: screen-region
    status: active
    card_path: навигация/навигация-меню.md
    template_id: navigation-content-ui-menu
    diagram_source: навигация/навигация-меню.plantuml
    diagram_artifact: навигация/навигация-меню.png
    intent: Дать пользователю переходы между несколькими разделами или маршрутами с сохранением выбранного пункта.
    required_conditions:
      - существует несколько разделов или маршрутов
      - пользователю требуется переходить между ними
    selection_signals:
      - иерархия разделов
      - selected item
      - nested items
      - верхняя или боковая навигация
    contraindications:
      - существует единственный линейный переход
      - структура маршрутов не подтверждена требованиями
    compatible_with: [ui-patterns.lists.data-table]
    limitations:
      - menu structure does not define project permissions or route ownership by itself

  - id: ui-patterns.dialogs.modal-dialog
    title: Модальный диалог с действиями
    family: dialogs
    pattern_type: DIALOG_OVERLAY_UI
    decision_scope: overlay-block
    status: active
    card_path: диалоги/модальный-диалог.md
    template_id: dialog-overlay-ui-modal
    diagram_source: диалоги/модальный-диалог.plantuml
    diagram_artifact: диалоги/модальный-диалог.png
    intent: Временно сфокусировать внимание на коротком контекстном взаимодействии поверх текущего экрана.
    required_conditions:
      - действие требует временного фокуса
      - взаимодействие можно завершить в ограниченной области
    selection_signals:
      - confirmation
      - короткая контекстная форма
      - asynchronous operation
      - явное разделение confirm и cancel
    contraindications:
      - содержание требует длительного чтения
      - требуется сложная навигация
      - действие можно выполнить без прерывания текущего контекста
    compatible_with: [ui-patterns.forms.form-data-entry-validation]
    limitations:
      - dialog size, mobile behavior and full accessibility contract require project decisions

  - id: ui-patterns.dashboards.dashboard-monitoring
    title: Мониторинговая панель
    family: dashboards
    pattern_type: DASHBOARD_MONITORING_UI
    decision_scope: screen-block
    status: active
    card_path: панели-мониторинга/панель-мониторинга.md
    template_id: dashboard-monitoring-ui
    diagram_source: панели-мониторинга/панель-мониторинга.plantuml
    diagram_artifact: панели-мониторинга/панель-мониторинга.png
    intent: Обеспечить обзор ключевых показателей и интерактивное исследование связанных данных.
    required_conditions: [несколько связанных показателей или визуализаций, необходимость обзора или исследования данных]
    selection_signals: [KPI, визуальная иерархия, фильтрация, linked charts, drill-down]
    contraindications: [достаточно одного простого показателя, отсутствует подтверждённый источник данных, не требуется сравнение или исследование]
    version: 1.0
    limitations: [полный accessibility и responsive контракт задаётся проектом, состояния данных и правила обновления задаются проектом]

  - id: ui-patterns.mobile.mobile-touch-interface
    title: Мобильный сенсорный интерфейс (mobile touch interface)
    family: mobile
    pattern_type: MOBILE_TOUCH_UI
    decision_scope: screen-and-interaction
    status: active
    card_path: мобильные/мобильный-сенсорный-интерфейс.md
    template_id: mobile-touch-ui
    diagram_source: мобильные/мобильный-сенсорный-интерфейс.plantuml
    diagram_artifact: мобильные/мобильный-сенсорный-интерфейс.png
    intent: Обеспечить выполнение пользовательской задачи на сенсорном устройстве через достижимые контролы, понятные переходы, стандартные жесты и доступные альтернативы основным действиям.
    required_conditions:
      - основной способ взаимодействия выполняется через touch
      - экран должен работать на мобильном viewport
      - требуется определить поведение при изменении orientation, safe area или software keyboard
    selection_signals:
      - tap, swipe, drag, touch-and-hold или zoom
      - первичная навигация должна оставаться достижимой в рабочей области
      - проект требует альтернативного способа ввода или доступности touch-взаимодействий
    contraindications:
      - основной сценарий выполняется только клавиатурой и указателем без touch-взаимодействия
      - мобильный viewport, роли, действия или ограничения устройства не подтверждены
      - решение зависит от жеста без видимой или доступной альтернативы
    compatible_with: [ui-patterns.navigation.menu-navigation, ui-patterns.lists.data-table, ui-patterns.forms.form-data-entry-validation, ui-patterns.dialogs.modal-dialog]
    limitations:
      - platform-specific размеры touch-целей, responsive, offline и accessibility правила фиксируются проектом
    version: 1.0
