<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Шаблон панели мониторинга</title><link rel="stylesheet" href="../эталонный-шаблон/styles.css"></head>
<body><main class="screen" data-template-id="dashboard-monitoring-screen">
  <header class="screen-header"><p class="eyebrow">ПАНЕЛЬ МОНИТОРИНГА</p><h1>Сводка показателей</h1><p class="muted">Приоритеты метрик, фильтры и drill-down.</p></header>
  <section class="layout"><article class="panel"><h2>Метрики</h2><p>Объём: 128</p><p>Выполнение: 84%</p><p>Задержка: в норме</p><button id="primary-action" type="button">Обновить показатели</button></article><aside class="panel"><h2>Фильтры</h2><p>Период, режим и состояние данных.</p></aside></section>
  <p id="status" class="status" role="status">Показатели актуальны</p><p id="error" class="error" role="alert" hidden>Состояние ошибки и восстановления.</p>
</main><script src="../эталонный-шаблон/script.js"></script></body></html>
