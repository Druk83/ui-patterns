<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Шаблон навигации</title><link rel="stylesheet" href="../эталонный-шаблон/styles.css"></head>
<body><main class="screen" data-template-id="navigation-menu-screen">
