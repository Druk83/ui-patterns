<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Шаблон командной строки</title><link rel="stylesheet" href="../эталонный-шаблон/styles.css"></head>
<body><main class="screen" data-template-id="cli-command-screen"><header class="screen-header"><p class="eyebrow">CLI</p><h1>Командная строка</h1><p class="muted">Команда, аргументы, результат и код выхода.</p></header><section class="layout"><article class="panel"><h2>Терминал</h2><pre>$ sdd validate --screen demo; результат: проверка выполнена</pre><button id="primary-action" type="button">Запустить команду</button></article><aside class="panel"><h2>Справка</h2><p>Ошибки, повторный запуск и безопасное завершение.</p></aside></section><p id="status" class="status" role="status">Команда не запускалась</p><p id="error" class="error" role="alert" hidden>Состояние ошибки и восстановления.</p></main><script src="../эталонный-шаблон/script.js"></script></body></html>
