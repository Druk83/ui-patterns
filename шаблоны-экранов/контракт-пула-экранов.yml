schema_version: 1

kind: screen-pool
ownership: project-repository
purpose: Машиночитаемый контракт пула экранов, который проект-потребитель формирует до детализации экранных спецификаций.

pool:
  required:
    - pool_id
    - version
    - template_set_version
    - status
    - source_refs
    - screens
  status_values: [proposed, confirmed, superseded]
  confirmation_required_when_confirmed:
    - confirmed_by
    - confirmed_at
    - decision_ref

screen:
  required:
    - screen_id
    - title
    - screen_type
    - purpose
    - route_or_entry_point
    - roles
    - user_task
    - pattern_candidates
    - template_candidates
    - states
    - actions
    - transitions
    - viewport_candidates
    - reference_artifacts
    - rationale
    - source_refs
    - status
  status_values: [proposed, confirmed, rejected, gap]

pattern_candidate:
  required:
    - pattern_id
    - rationale
    - status
  status_values: [proposed, confirmed, rejected, gap]

template_candidate:
  required:
    - template_id
    - rationale
    - status
  status_values: [proposed, confirmed, rejected, gap]

viewport_candidate:
  required:
    - viewport_id
    - width
    - height
    - unit
    - orientation
    - responsive_profile
    - breakpoint_conditions
    - purpose
    - source
    - rationale
    - status
    - screen_shell_candidates
  unit_values: [css-px]
  orientation_values: [portrait, landscape, any]
  purpose_values: [reference, supported, minimum, maximum, stress]
  status_values: [proposed, confirmed, rejected, gap]

  screen_shell_candidates:
    type: non-empty-list
    item_required: [status]
    status_values: [selected, proposed, rejected, gap, not_applicable]
    selected_requires: [catalog_url, catalog_revision, shell_id, shell_viewport, rationale]
    proposed_requires: [catalog_url, catalog_revision, shell_id, shell_viewport, rationale]
    rejected_requires: [catalog_url, catalog_revision, shell_id, shell_viewport, rationale]
    gap_requires: [reason, decision_needed]
    not_applicable_requires: [rationale]
    shell_viewport_required: [width, height, unit, orientation]
    selected_count: at-most-one
    rules:
      - shell_viewport должен точно совпадать с шириной, высотой, единицей измерения и ориентацией родительского viewport.
      - Выбранная или предложенная оболочка должна разрешаться в неизменяемой ревизии каталога, указанной в catalog_url и catalog_revision.
      - Для нескольких вариантов перечисляются отдельные элементы со статусом proposed; selected может быть не более одного.
      - not_applicable используется только для невизуального артефакта; визуальная часть VUI/NUI также требует оболочку.

reference_artifact:
  required:
    - artifact_id
    - type
    - path_or_url
    - status
  status_values: [proposed, confirmed, rejected, gap]

rules:
  - Размеры viewport указываются в CSS px и получают source и rationale.
  - Название устройства без размера, источника и обоснования не является допустимым viewport-кандидатом.
  - Пул со статусом confirmed должен содержать только подтверждённые экраны и хотя бы один подтверждённый viewport для каждого экрана.
  - Пустые сведения о продукте фиксируются как gap, а не заменяются универсальным экраном.
  - Финальный шаблон экрана подтверждается вместе с пулом; черновую композицию разрешено подготавливать раньше по запросу разработчика.
  - Screen UI template задаёт композицию содержимого; точная оболочка viewport выбирается отдельно из каталога проекта-потребителя.
  - Для визуального экрана без точной оболочки в screen_shell_candidates указывается элемент со статусом gap; приблизительная responsive-страница не считается заменой.
  - UI-проектирование можно начать до подтверждения пула; такие экраны и оболочки остаются proposed до решения разработчика.
