<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Разговорный шаблон</title><link rel="stylesheet" href="../эталонный-шаблон/styles.css"></head>
<body><main class="screen" data-template-id="conversational-screen"><header class="screen-header"><p class="eyebrow">РАЗГОВОРНЫЙ ИНТЕРФЕЙС</p><h1>Диалоговый сценарий</h1><p class="muted">Сообщения, контекст, уточнение и передача управления.</p></header><section class="layout"><article class="panel"><h2>Диалог</h2><p>Ассистент: Чем помочь?</p><p>Пользователь: Показать статус задачи.</p><button id="primary-action" type="button">Отправить уточнение</button></article><aside class="panel"><h2>Контекст</h2><p>История, приватность и handoff.</p></aside></section><p id="status" class="status" role="status">Ожидание сообщения</p><p id="error" class="error" role="alert" hidden>Состояние ошибки и восстановления.</p></main><script src="../эталонный-шаблон/script.js"></script></body></html>
