<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Шаблон списка</title><link rel="stylesheet" href="../эталонный-шаблон/styles.css"></head>
<body><main class="screen" data-template-id="list-detail-table-screen">
  <header class="screen-header"><p class="eyebrow">СПИСОК И ТАБЛИЦА</p><h1>Коллекция объектов</h1><p class="muted">Поиск, фильтрация, сортировка и переход к деталям.</p></header>
  <section class="layout"><article class="panel"><h2>Результаты</h2><table><tbody><tr><th>Название</th><th>Статус</th></tr><tr><td>Объект A</td><td>Готов</td></tr><tr><td>Объект B</td><td>В работе</td></tr></tbody></table><button id="primary-action" type="button">Обновить список</button></article><aside class="panel"><h2>Фильтры</h2><p>Состояния loading, empty, filtered-empty и error.</p></aside></section>
  <p id="status" class="status" role="status">Список загружен</p><p id="error" class="error" role="alert" hidden>Состояние ошибки и восстановления.</p>
</main><script src="../эталонный-шаблон/script.js"></script></body></html>
