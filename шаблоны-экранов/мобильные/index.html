<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Мобильный шаблон</title><link rel="stylesheet" href="../эталонный-шаблон/styles.css"></head>
<body><main class="screen" data-template-id="mobile-touch-shell-screen">
  <header class="screen-header"><p class="eyebrow">МОБИЛЬНАЯ КОМПОЗИЦИЯ</p><h1>Быстрое действие</h1><p class="muted">Пример компоновки touch-интерфейса; точную оболочку задаёт проект-потребитель.</p></header>
  <section class="layout"><article class="panel"><h2>Карточка действия</h2><p>Крупные зоны касания и короткий путь выполнения.</p><button id="primary-action" type="button">Выполнить</button></article><aside class="panel"><h2>Состояние</h2><p>Portrait, landscape и narrow viewport.</p></aside></section>
  <p id="status" class="status" role="status">Готово к касанию</p><p id="error" class="error" role="alert" hidden>Состояние ошибки и восстановления.</p>
</main><script src="../эталонный-шаблон/script.js"></script></body></html>
